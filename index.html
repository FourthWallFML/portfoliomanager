<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUX Portfolio Manager - Google Sheets Backend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-20 antialiased selection:bg-emerald-500 selection:text-white">
  <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/95 backdrop-blur-md border border-slate-700/80 p-5 rounded-2xl shadow-xl">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-cyan-400 p-0.5 shadow-lg shadow-emerald-500/20 flex items-center justify-center">
          <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center text-emerald-400">
            <i data-lucide="trending-up" class="w-6 h-6"></i>
          </div>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-2xl font-extrabold tracking-tight text-white font-sans">BUX Portfolio Manager</h1>
            <span class="px-2 py-0.5 text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full uppercase tracking-wider">Google Sheets & Live API</span>
          </div>
          <p class="text-xs text-slate-400 flex flex-wrap items-center gap-2 mt-0.5">
            <span>BUX transacties, Google Sheets koersen & TWR</span>
            <span id="price-update-time" class="hidden text-slate-300 bg-slate-700/70 px-2 py-0.5 rounded text-[11px] font-mono"></span>
            <span id="fx-rate-badge" class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded text-[11px] font-mono">EUR/USD: 1,0800</span>
          </p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2.5">
        <button id="pwa-install-btn" class="hidden px-3.5 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-semibold rounded-xl transition shadow-md flex items-center gap-1.5">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>Installeer App</span>
        </button>
        <button id="btn-fetch-twr" onclick="generateTWRHistory()" class="px-3.5 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl transition shadow-sm flex items-center gap-2">
          <i id="twr-icon" data-lucide="history" class="w-4 h-4"></i>
          <span id="twr-btn-text">Herbereken TWR</span>
        </button>
        <button id="btn-fetch-prices" onclick="fetchLivePrices()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition shadow-sm flex items-center gap-2">
          <i id="sync-icon" data-lucide="refresh-cw" class="w-4 h-4"></i>
          <span id="sync-text">Live Koersen Ophalen</span>
        </button>
        <input type="file" id="csv-file-input" accept="*/*" class="hidden" onchange="handleFileUpload(event)">
        <button onclick="triggerFileInput()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition shadow-sm flex items-center gap-2">
          <i data-lucide="file-up" class="w-4 h-4"></i>
          <span>Importeer BUX CSV</span>
        </button>
        <button onclick="openSettingsModal()" title="Netwerk & Ticker Mapping" class="p-2 bg-slate-700/60 hover:bg-slate-600 text-slate-300 text-xs font-medium rounded-xl border border-slate-600/60 transition flex items-center gap-1">
          <i data-lucide="settings" class="w-4 h-4"></i>
          <span class="text-xs hidden sm:inline">Mapping</span>
        </button>
        <button onclick="clearData()" title="Wis alle data" class="p-2 bg-slate-700/60 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 text-xs font-medium rounded-xl border border-slate-600/60 transition">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Notificatie Banner -->
    <div id="status-banner" class="hidden bg-slate-800/90 border border-slate-700 text-slate-200 text-xs px-4 py-3 rounded-xl flex items-center justify-between shadow-lg transition">
      <div class="flex items-center gap-2.5">
        <i id="status-icon" data-lucide="info" class="w-4 h-4 text-emerald-400"></i>
        <span id="status-banner-text">Melding...</span>
      </div>
      <button onclick="document.getElementById('status-banner').classList.add('hidden')" class="text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Navigatie Tabs -->
    <nav class="flex border-b border-slate-700/80 space-x-2">
      <button onclick="switchTab('dashboard')" id="tab-btn-dashboard" class="px-4 py-2.5 text-sm font-semibold border-b-2 border-emerald-400 text-emerald-400 flex items-center gap-2 transition">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        <span>Portfolio Dashboard</span>
      </button>
      <button onclick="switchTab('holdings')" id="tab-btn-holdings" class="px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition">
        <i data-lucide="layers" class="w-4 h-4"></i>
        <span>Posities & Koersen</span>
      </button>
      <button onclick="switchTab('transactions')" id="tab-btn-transactions" class="px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition">
        <i data-lucide="history" class="w-4 h-4"></i>
        <span>Transactiehistorie</span>
      </button>
    </nav>

    <!-- TAB 1: DASHBOARD -->
    <main id="tab-content-dashboard" class="space-y-6">
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
          <i data-lucide="activity" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>Financieel Overzicht</span>
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5">
          <div class="bg-slate-800/85 p-4 rounded-xl border border-slate-700/80 shadow-sm relative overflow-hidden">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Total Value</span>
            <div id="kpi-total-val" class="text-2xl font-bold mt-1 text-white">€ 0,00</div>
            <div class="text-[11px] text-slate-400 mt-1 flex items-center gap-1">
              <span>Cash:</span> <span id="kpi-sub-cash" class="text-slate-300 font-medium">€ 0,00</span>
            </div>
          </div>
          <div class="bg-slate-800/85 p-4 rounded-xl border border-slate-700/80 shadow-sm relative overflow-hidden">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Deposits</span>
            <div id="kpi-deposits" class="text-2xl font-bold mt-1 text-
